[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cortex-runtime"
version = "0.2.1"
description = "Spatiotemporal authority and semantic verification framework for autonomous workflows"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "Iradukunda Fils" }
]
keywords = [
    "verification",
    "workflow",
    "sandbox",
    "agents",
    "capability-security",
    "spatiotemporal",
    "architecture",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "pydantic>=2.0.0,<3.0.0",
    "pyyaml>=6.0.0,<7.0.0",
    "typing-extensions>=4.5.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "pyright>=1.1.0",
    "build>=1.0.0",
    "pre-commit>=3.0.0",
    "types-pyyaml>=6.0.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
]

[project.urls]
Homepage = "https://github.com/Iradukunda-Fils/Cortex"
Documentation = "https://github.com/Iradukunda-Fils/Cortex#readme"
Repository = "https://github.com/Iradukunda-Fils/Cortex.git"
Issues = "https://github.com/Iradukunda-Fils/Cortex/issues"

[project.scripts]
cortex = "cortex.tools.cli.main:cli_entrypoint"

[tool.hatch.build.targets.sdist]
include = [
    "/cortex",
    "/README.md",
    "/LICENSE",
]

[tool.hatch.build.targets.wheel]
packages = ["cortex"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
