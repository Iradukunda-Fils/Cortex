name: Hierarchical Verification Substrate Gate

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Code Quality, Linting & Type Safety Gate (Python)
  code-quality-python:
    name: Code Quality & Type Safety (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ vars.PYTHON_VERSION || '3.13' }}
          cache: 'pip'
      - name: Install Dependencies & Type Stubs
        run: pip install -e ".[dev]"
      - name: Code Quality & Lint Check (Ruff)
        run: ruff check .
      - name: Strict Type Safety Analysis (Pyright)
        run: pyright
      - name: Spec Freeze Integrity Check
        run: ./scripts/check_contract_freeze.sh

  # 2. Kernel Runtime & Conformance Test Suite
  kernel-conformance:
    name: Kernel Runtime & Conformance Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ vars.PYTHON_VERSION || '3.13' }}
          cache: 'pip'
      - name: Install Dependencies
        run: pip install -e ".[dev]"
      - name: "Stage 1: Structural & Schema Validation (Golden Hash Check)"
        run: cd tests/golden/v1.0.0 && sha256sum -c SHA256SUMS
      - name: "Stage 2: Conformance, Kernel Runtime & Semantic Equivalence"
        run: |
          PYTHONPATH=. python3 tests/conformance/run_certification.py
          PYTHONPATH=. python3 -m unittest discover -s tests -v
      - name: "Stage 3: Mutation Immunity & Regression Corpus Replay"
        run: |
          PYTHONPATH=. python3 -m unittest tests/conformance/test_adapter_mutations.py -v
          python3 scripts/replay_golden_vectors.py --corpus tests/golden/v1.0.0/

  # 3. Rust Emulator Quality & Test Suite
  rust-emulator-gate:
    name: Rust Code Quality & Test Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cortex-emulator
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cortex-emulator -> target
      - name: Rust Formatting Check (cargo fmt)
        run: cargo fmt --check
      - name: Rust Linter & Static Analysis (cargo clippy)
        run: cargo clippy -- -D warnings
      - name: Rust Test Execution
        run: cargo test --verbose

  # 4. Formal Soundness Proofs Gate (Coq)
  coq-verification-gate:
    name: Formal Coq Proof Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify Formal Coq Soundness Proofs
        run: |
          docker run --rm --user root \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace/verification \
            -e OPAMROOT=/home/coq/.opam \
            coqorg/coq:8.18-ocaml-4.14-flambda \
            sh -c 'eval $(opam env --switch=default --set-root) && coq_makefile -f _CoqProject -o Makefile.coq && make -f Makefile.coq'

  # 5. Final Enforcement Gate (Fan-In Aggregator)
  enforcement-gate:
    name: Hierarchical Substrate Gate Pass
    needs: [code-quality-python, kernel-conformance, rust-emulator-gate, coq-verification-gate]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm All Quality & Conformance Gates Passed
        run: |
          echo "SUCCESS: Hierarchical Verification Substrate Gate Passed. Merge allowed."
