name: PyPI Release & Test Automation

on:
  push:
    branches: [ main, "release/*" ]
    tags: [ 'v*' ]

permissions:
  contents: read

jobs:
  test:
    name: Test & Quality Gate
    runs-on: ubuntu-latest  

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ vars.PYTHON_VERSION || '3.13' }}

      - name: Install Dependencies from Lockfile
        run: uv sync --all-extras

      - name: Run Canonical Verification Gate
        run: ./scripts/verify.sh

  publish:
    name: Publish Package to PyPI
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Mandatory for PyPI OIDC Trusted Publishing
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Build Package Artifacts with uv build
        run: uv build

      - name: Publish Package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
